name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: dvlg-linux.tar.gz
            asset_path: dvlg-linux.tar.gz
          - os: macos-latest
            artifact_name: dvlg-macos.tar.gz
            asset_path: dvlg-macos.tar.gz
          - os: windows-latest
            artifact_name: dvlg-windows.zip
            asset_path: dvlg-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.artifact_name }} -C target/release dvlg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/dvlg.exe -DestinationPath ${{ matrix.artifact_name }}

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
